name: Run IWM Small-Cap Research Pilot

on:
  workflow_dispatch:

jobs:
  run-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run offline checks
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do python "$test_file"; done
          node tests/test_dashboard_js.mjs
      - name: Screen listed IWM equity holdings
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python iwm_pilot.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iwm-pilot-${{ github.run_id }}
          path: pilot-output/iwm/
          retention-days: 14
          if-no-files-found: error
