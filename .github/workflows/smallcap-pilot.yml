name: Run IJR Small-Cap Pilot

on:
  workflow_dispatch:
    inputs:
      publish_results:
        description: "Commit validated pilot results to the selected branch"
        required: false
        default: false
        type: boolean

jobs:
  run-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run offline checks
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do python "$test_file"; done
          node tests/test_dashboard_js.mjs
      - name: Screen IJR equity holdings
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python smallcap_pilot.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ijr-pilot-${{ github.run_id }}
          path: |
            docs/data/results_smallcap.json
            docs/data/stats_smallcap.json
            docs/data/holdings_smallcap.csv
          retention-days: 14
          if-no-files-found: error
      - name: Publish pilot data
        if: inputs.publish_results == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/results_smallcap.json docs/data/stats_smallcap.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish IJR pilot results"
            git push
          fi
